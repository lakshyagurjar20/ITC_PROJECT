# grafana/provisioning/dashboards/dashboard-provider.yml
# Tells Grafana where to find dashboard JSON files to auto-load.

apiVersion: 1

providers:
  - name: "CyberSentinel"
    orgId: 1
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards   # mapped in docker-compose.yml
      foldersFromFilesStructure: false
