# prometheus/prometheus.yml
# Prometheus scrape configuration for CyberSentinel.
#
# Running natively on Windows — scrapes the Flask app on localhost:5000.

global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "cybersentinel"
    static_configs:
      - targets: ["localhost:5000"]
    metrics_path: /metrics
